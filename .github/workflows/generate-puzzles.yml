# Keeps 30 days of puzzles generated ahead in the deployed database (DEPLOY.md).
# Off until the repository variable ENABLE_PUZZLE_GENERATION is "true" and the secret
# DATABASE_URL is set (the database's direct or session-pooler URL, not the transaction pooler).
name: Generate puzzles

on:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 02:30 UTC
  workflow_dispatch:

jobs:
  generate:
    if: ${{ vars.ENABLE_PUZZLE_GENERATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
      - name: Generate the next 30 days (existing days are kept)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python -m geo_pipeline.generate_puzzles --days 30
