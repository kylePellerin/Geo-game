services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geo_game
      POSTGRES_USER: geo_game
      POSTGRES_PASSWORD: geo_game_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_game -d geo_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
