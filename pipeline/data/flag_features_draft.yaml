# AI-drafted flag feature lists (ISO 3166-1 alpha-2), one list per tag. NOT yet human-reviewed.
# geo_pipeline.flags merges these with colours measured from the flag-icons SVGs and writes
# pipeline/flags_tags.yaml (one entry per country) for review. Review edits go in flags_tags.yaml.
#
# Conventions for the draft:
# - Features count if visible on the national flag as rendered by flag-icons (including coats of
#   arms/emblems on the flag), because that is the image players see in the reveal.
# - has_cross includes saltires and Union Jack crosses; has_nordic_cross is the off-centre cross only.
# - has_sun includes plain discs that officially represent the sun (Japan, Bangladesh, Niger).
# - has_crescent includes full/crescent moons (Laos, Palau, Nepal).
# - Items marked "# check" are uncertain and need a look during review.

