[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-rarity-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "cairosvg>=2.7",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["db: needs the local Postgres (skipped if unreachable)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["geo_pipeline*"]

[tool.ruff.lint]
# The repo lives on a Windows bind mount where every file reports as executable.
ignore = ["EXE001", "EXE002"]
