- id: airport_named_after_person
  family: airports
  kind: membership
  entity_type: airport
  difficulty: 2
  text: "Name an airport in {continent.name} that is named after a person"
  params:
    continent:
      - {name: Europe}
      - {name: North America}
      - {name: South America}
      - {name: Asia}
      - {name: Africa}
  filter: >-
    jsonb_array_length(coalesce(e.attrs->'named_after', '[]')) > 0
    AND c.attrs->>'continent' = :continent.name

- id: airport_busiest_in_country
  family: airports
  kind: superlative_per_group
  entity_type: airport
  difficulty: 2
  text: "Name an airport that is the busiest in its country"
  # Only countries where every large airport has a recent (2019+) annual passenger count, so the
  # true busiest airport is known. Territories are excluded.
  filter: >-
    e.attrs->>'territory' IS NULL
    AND (e.attrs->>'passengers_year')::int >= 2019
    AND NOT EXISTS (SELECT 1 FROM entities o WHERE o.type = 'airport' AND o.country_id = e.country_id
                    AND o.attrs->>'territory' IS NULL AND o.attrs->>'airport_type' = 'large'
                    AND coalesce((o.attrs->>'passengers_year')::int, 0) < 2019)
    AND (e.attrs->>'passengers')::bigint = (
      SELECT max((o.attrs->>'passengers')::bigint) FROM entities o
      WHERE o.type = 'airport' AND o.country_id = e.country_id AND o.attrs->>'territory' IS NULL
      AND (o.attrs->>'passengers_year')::int >= 2019)

- id: airport_passengers_over
  family: airports
  kind: threshold
  entity_type: airport
  difficulty: 3
  text: "Name an airport that handled more than {n.text} passengers in a year"
  params:
    n:
      - {value: 30000000, text: "30 million"}
      - {value: 50000000, text: "50 million"}
  filter: >-
    (e.attrs->>'passengers')::float > :n.value AND (e.attrs->>'passengers_year')::int >= 2019

- id: airport_passengers_in_continent
  family: airports
  kind: intersection
  entity_type: airport
  difficulty: 3
  text: "Name an airport in {continent.name} that handled more than {n.text} passengers in a year"
  params:
    continent:
      - {name: Europe}
      - {name: Asia}
      - {name: North America}
    n:
      - {value: 15000000, text: "15 million"}
      - {value: 25000000, text: "25 million"}
  filter: >-
    c.attrs->>'continent' = :continent.name AND (e.attrs->>'passengers')::float > :n.value
    AND (e.attrs->>'passengers_year')::int >= 2019

- id: airport_high
  family: airports
  kind: threshold
  entity_type: airport
  difficulty: 3
  text: "Name an airport more than {m.text} above sea level"
  params:
    m:
      - {value: 2000, text: "2,000 m (6,600 ft)"}
      - {value: 2500, text: "2,500 m (8,200 ft)"}
      - {value: 3000, text: "3,000 m (9,800 ft)"}
  filter: "(e.attrs->>'elevation_m')::float > :m.value"

- id: airport_busiest_in_continent
  family: airports
  kind: superlative_per_group
  entity_type: airport
  difficulty: 3
  text: "Name the busiest airport of any country in {continent.name}"
  params:
    continent:
      - {name: Europe}
      - {name: Asia}
      - {name: Africa}
      - {name: North America}
      - {name: South America}
  # same "true busiest is known" rule as airport_busiest_in_country
  filter: >-
    c.attrs->>'continent' = :continent.name
    AND e.attrs->>'territory' IS NULL
    AND (e.attrs->>'passengers_year')::int >= 2019
    AND NOT EXISTS (SELECT 1 FROM entities o WHERE o.type = 'airport' AND o.country_id = e.country_id
                    AND o.attrs->>'territory' IS NULL AND o.attrs->>'airport_type' = 'large'
                    AND coalesce((o.attrs->>'passengers_year')::int, 0) < 2019)
    AND (e.attrs->>'passengers')::bigint = (
      SELECT max((o.attrs->>'passengers')::bigint) FROM entities o
      WHERE o.type = 'airport' AND o.country_id = e.country_id AND o.attrs->>'territory' IS NULL
      AND (o.attrs->>'passengers_year')::int >= 2019)
  min_answers: 8

- id: airport_major_in_continent
  family: airports
  kind: membership
  entity_type: airport
  difficulty: 2
  text: "Name a major international airport in {continent.name}"
  params:
    continent:
      - {name: Europe}
      - {name: Asia}
      - {name: Africa}
      - {name: South America}
      - {name: Oceania}
  filter: "e.attrs->>'airport_type' = 'large' AND c.attrs->>'continent' = :continent.name"
