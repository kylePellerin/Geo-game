      - {iso2: GB, text: "the United Kingdom"}
      - {iso2: FR, text: "France"}
      - {iso2: DE, text: "Germany"}
      - {iso2: IT, text: "Italy"}
      - {iso2: ES, text: "Spain"}
      - {iso2: JP, text: "Japan"}
      - {iso2: AU, text: "Australia"}
      - {iso2: CA, text: "Canada"}
      - {iso2: MX, text: "Mexico"}
      - {iso2: BR, text: "Brazil"}
      - {iso2: IN, text: "India"}
      - {iso2: TR, text: "Turkey"}
      - {iso2: SE, text: "Sweden"}
      - {iso2: "NO", text: "Norway"}  # quoted: bare NO is boolean in YAML
      - {iso2: TH, text: "Thailand"}
      - {iso2: CN, text: "China"}
      - {iso2: RU, text: "Russia"}
      - {iso2: ID, text: "Indonesia"}
      - {iso2: PH, text: "the Philippines"}
      - {iso2: AR, text: "Argentina"}
      - {iso2: CO, text: "Colombia"}
      - {iso2: ZA, text: "South Africa"}
      - {iso2: NG, text: "Nigeria"}
      - {iso2: GR, text: "Greece"}
      - {iso2: PT, text: "Portugal"}
      - {iso2: PL, text: "Poland"}
      - {iso2: NZ, text: "New Zealand"}
      - {iso2: IR, text: "Iran"}
      - {iso2: PK, text: "Pakistan"}
      - {iso2: VN, text: "Vietnam"}
      - {iso2: MY, text: "Malaysia"}
      - {iso2: SA, text: "Saudi Arabia"}
