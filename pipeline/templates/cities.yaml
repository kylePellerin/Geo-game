      - {name: Danube, text: "Danube"}
      - {name: Rhine, text: "Rhine"}
      - {name: Nile, text: "Nile"}
      - {name: Volga, text: "Volga"}
      - {name: Yangtze River, text: "Yangtze"}
      - {name: Vistula, text: "Vistula"}
      - {name: Dnieper, text: "Dnieper"}
      - {name: Mississippi River, text: "Mississippi"}
      - {name: Seine, text: "Seine"}
      - {name: Ganges, text: "Ganges"}
      - {name: Amazon River, text: "Amazon"}
      - {name: Elbe, text: "Elbe"}
      - {name: Rhône, text: "Rhône"}
      - {name: Loire, text: "Loire"}
      - {name: Po, text: "Po"}
      - {name: Tigris, text: "Tigris"}
      - {name: Euphrates, text: "Euphrates"}
      - {name: Mekong, text: "Mekong"}
      - {name: Indus River, text: "Indus"}
      - {name: Niger River, text: "Niger river"}
      - {name: Oder, text: "Oder"}
      - {name: Main, text: "Main (in Germany)"}
      - {name: Paraná River, text: "Paraná"}
      - {name: St. Lawrence River, text: "St. Lawrence"}
      - {name: Missouri River, text: "Missouri river"}
      - {name: Ohio River, text: "Ohio river"}
      - {name: Don, text: "Don (in Russia)"}
  filter: >-
    e.attrs->'rivers' ? :river.name
