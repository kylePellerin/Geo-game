# Countries (QUESTIONS.md §3.2) and names (§3.9). Answer type: country.

- id: country_in_continent
  territories: true
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country in {continent.name}"
  params:
    continent:
      - {name: Africa}
      - {name: Asia}
      - {name: Europe}
      - {name: North America}
      - {name: South America}
      - {name: Oceania}
  filter: "e.attrs->>'continent' = :continent.name"

- id: country_in_subregion
  territories: true
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country in {region.text}"
  params:
    region:
      - {name: Caribbean, text: "the Caribbean"}
      - {name: Southern Europe, text: "Southern Europe"}
      - {name: Northern Europe, text: "Northern Europe"}
      - {name: Eastern Europe, text: "Eastern Europe"}
      - {name: Western Europe, text: "Western Europe"}
      - {name: Western Africa, text: "West Africa"}
      - {name: Eastern Africa, text: "East Africa"}
      - {name: South-Eastern Asia, text: "Southeast Asia"}
      - {name: Western Asia, text: "the Middle East or Caucasus", difficulty: 2}
  filter: "e.attrs->>'subregion' = :region.name"

- id: country_landlocked
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a landlocked country (no coastline)"
  filter: "(e.attrs->>'landlocked')::boolean"

- id: country_landlocked_in_continent
  family: countries
  kind: intersection
  entity_type: country
  difficulty: 2
  text: "Name a landlocked country in {continent.name}"
  params:
    continent:
      - {name: Africa}
      - {name: Asia}
      - {name: Europe}
  filter: "(e.attrs->>'landlocked')::boolean AND e.attrs->>'continent' = :continent.name"

- id: country_island
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country that is an island or made up of islands"
  filter: "(e.attrs->>'island_nation')::boolean"

- id: country_population_over
  territories: true
  family: countries
  kind: threshold
  entity_type: country
  difficulty: 1
  text: "Name a country with more than {n.text} people"
  params:
    n:
      - {value: 50000000, text: "50 million"}
      - {value: 100000000, text: "100 million"}
  filter: "(e.attrs->>'population')::float > :n.value"

- id: country_bigger_than
  family: countries
  kind: threshold
  entity_type: country
  difficulty: 1
  text: "Name a country that is bigger than {ref.name} by area"
  params:
    ref:
      - {name: France}
      - {name: Egypt}
      - {name: Mexico}
      - {name: Germany}
  filter: >-
    (e.attrs->>'area_km2')::float > (SELECT (r.attrs->>'area_km2')::float FROM entities r
                                     WHERE r.type = 'country' AND r.name = :ref.name)

- id: country_drives_left
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country where people drive on the left"
  filter: "e.attrs->>'drives_on' = 'left'"

- id: country_official_language
  territories: true
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country where {language.name} is an official language"
  params:
    language:
      - {name: English}
      - {name: French}
      - {name: Spanish}
      - {name: Arabic}
      - {name: Portuguese}
  filter: "e.attrs->'languages' ? :language.name"

- id: country_uses_euro
  territories: true
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country that uses the euro"
  filter: "e.attrs->'currencies' ? 'EUR'"

- id: country_capital_not_largest
  family: countries
  kind: relational
  entity_type: country
  difficulty: 3
  text: "Name a country whose capital is not its biggest city"
  filter: >-
    EXISTS (SELECT 1 FROM entities big WHERE big.type = 'city' AND big.country_id = e.id
            AND big.attrs->>'territory' IS NULL
            AND (big.attrs->>'population')::float > (
              SELECT max((cap.attrs->>'population')::float) FROM entities cap
              WHERE cap.type = 'city' AND cap.country_id = e.id
              AND (cap.attrs->>'is_capital')::boolean))

- id: country_smaller_than
  territories: true
  family: countries
  kind: threshold
  entity_type: country
  difficulty: 3
  text: "Name a country smaller than {area.text}"
  params:
    area:
      - {value: 1000, text: "1,000 km² (about 400 square miles)"}
      - {value: 30000, text: "30,000 km² (about the size of Belgium)", difficulty: 2}
  filter: "(e.attrs->>'area_km2')::float < :area.value"

# ---- names & language (§3.9)

- id: country_starts_with
  territories: true
  family: names
  kind: name_twist
  entity_type: country
  difficulty: 1
  text: "Name a country whose name starts with the letter {letter.l}"
  params:
    letter:
      - {l: A}
      - {l: B}
      - {l: C}
      - {l: D}
      - {l: E}
      - {l: F}
      - {l: G}
      - {l: H}
      - {l: I}
      - {l: J}
      - {l: K}
      - {l: L}
      - {l: M}
      - {l: N}
      - {l: O}
      - {l: P}
      - {l: Q}
      - {l: R}
      - {l: S}
      - {l: T}
      - {l: U}
      - {l: V}
      - {l: W}
      - {l: X}
      - {l: Y}
      - {l: Z}
  filter: "upper(left(e.name, 1)) = :letter.l"

- id: country_ends_with
  territories: true
  family: names
  kind: name_twist
  entity_type: country
  difficulty: 1
  text: "Name a country whose name ends in {suffix.text}"
  params:
    suffix:
      - {pattern: "%ia", text: '"-ia" (like Australia)'}
      - {pattern: "%a", text: "the letter A"}
      - {pattern: "%n", text: "the letter N"}
      - {pattern: "%o", text: "the letter O"}
  filter: "lower(e.name) LIKE :suffix.pattern"

- id: country_name_words
  territories: true
  family: names
  kind: name_twist
  entity_type: country
  difficulty: 2
  text: "Name a country whose name is more than one word"
  filter: "e.name LIKE '% %'"

- id: country_population_under
  territories: true
  family: countries
  kind: threshold
  entity_type: country
  difficulty: 3
  text: "Name a country with fewer than {n.text} people"
  params:
    n:
      - {value: 1000000, text: "1 million", difficulty: 2}
      - {value: 200000, text: "200,000"}
  filter: "(e.attrs->>'population')::float < :n.value"

- id: country_capital_starts_with
  territories: true
  family: names
  kind: name_twist
  entity_type: country
  difficulty: 1
  text: "Name a country whose capital city starts with the letter {letter.l}"
  params:
    letter:
      - {l: A}
      - {l: B}
      - {l: C}
      - {l: D}
      - {l: E}
      - {l: F}
      - {l: G}
      - {l: H}
      - {l: I}
      - {l: J}
      - {l: K}
      - {l: L}
      - {l: M}
      - {l: N}
      - {l: O}
      - {l: P}
      - {l: Q}
      - {l: R}
      - {l: S}
      - {l: T}
      - {l: U}
      - {l: V}
      - {l: W}
      - {l: X}
      - {l: Y}
      - {l: Z}
  filter: >-
    EXISTS (SELECT 1 FROM entities cap WHERE cap.type = 'city' AND cap.country_id = e.id
            AND (cap.attrs->>'is_capital')::boolean AND upper(left(cap.name, 1)) = :letter.l)

- id: country_continent_population
  territories: true
  family: countries
  kind: intersection
  entity_type: country
  difficulty: 1
  text: "Name a country in {continent.name} with more than {n.text} people"
  params:
    continent:
      - {name: Africa}
      - {name: Asia}
      - {name: Europe}
      - {name: North America}
      - {name: South America}
    n:
      - {value: 10000000, text: "10 million"}
      - {value: 20000000, text: "20 million"}
      - {value: 50000000, text: "50 million"}
  filter: "e.attrs->>'continent' = :continent.name AND (e.attrs->>'population')::float > :n.value"

# ---- added 2026-11-20 from the enrichment step (geo_pipeline/ingest/enrich.py)

- id: country_monarchy
  family: countries
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country that has a king, queen or other monarch"
  filter: "(e.attrs->>'monarchy')::boolean"

- id: country_king_charles
  family: countries
  kind: membership
  entity_type: country
  difficulty: 2
  text: "Name a country where King Charles III is head of state"
  filter: "(e.attrs->>'king_charles')::boolean"

- id: country_named_after_person
  family: names
  kind: membership
  entity_type: country
  difficulty: 2
  text: "Name a country that is named after a person"
  filter: "jsonb_array_length(coalesce(e.attrs->'named_after_person', '[]')) > 0"
  min_answers: 10

- id: country_native_name_differs
  family: names
  kind: name_twist
  entity_type: country
  difficulty: 2
  text: "Name a country whose name in its own language starts with a different letter (like Germany: Deutschland)"
  # every Latin-script native name starts with a different letter from the English name
  filter: >-
    EXISTS (SELECT 1 FROM jsonb_array_elements_text(e.attrs->'native_names') n
            WHERE unaccent(n) ~ '^[A-Za-z]')
    AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements_text(e.attrs->'native_names') n
                    WHERE upper(left(unaccent(n), 1)) = upper(left(e.name, 1)))

- id: country_mountain_over
  family: nature
  kind: threshold
  entity_type: country
  difficulty: 2
  text: "Name a country with a mountain higher than {m.text}"
  params:
    m:
      - {value: 3000, text: "3,000 m (9,800 ft)", difficulty: 1}
      - {value: 4000, text: "4,000 m (13,100 ft)"}
      - {value: 5000, text: "5,000 m (16,400 ft)"}
      - {value: 6000, text: "6,000 m (19,700 ft)", difficulty: 3}
  filter: "(e.attrs->'highest_point'->>'elevation_m')::float > :m.value"

- id: country_flat
  family: nature
  kind: threshold
  entity_type: country
  difficulty: 3
  text: "Name a country whose highest point is lower than {m.text}"
  params:
    m:
      - {value: 500, text: "500 m (1,600 ft)"}
      - {value: 1000, text: "1,000 m (3,300 ft)", difficulty: 2}
  filter: "(e.attrs->'highest_point'->>'elevation_m')::float < :m.value"

- id: country_forest
  family: nature
  kind: threshold
  entity_type: country
  difficulty: 2
  text: "Name a country where {pct.text} of the land is covered by forest"
  params:
    pct:
      - {value: 50, text: "more than half"}
      - {value: 66, text: "more than two thirds", difficulty: 3}
  filter: "(e.attrs->>'forest_pct')::float > :pct.value"

- id: country_hosted_olympics
  family: olympics
  tail_min: 3  # every host is famous; rarity among players still differs
  kind: membership
  entity_type: country
  difficulty: 1
  text: "Name a country that has hosted the Olympic Games"
  filter: "jsonb_array_length(coalesce(e.attrs->'olympics_hosted', '[]')) > 0"
  min_answers: 10

- id: country_hosted_olympics_season
  family: olympics
  tail_min: 3  # every host is famous; rarity among players still differs
  kind: membership
  entity_type: country
  difficulty: 2
  text: "Name a country that has hosted the {season.text} Olympics"
  params:
    season:
      - {key: summer, text: "Summer"}
      - {key: winter, text: "Winter"}
  filter: >-
    e.attrs->'olympics_hosted' @> jsonb_build_array(jsonb_build_object('season', (:season.key)::text))
