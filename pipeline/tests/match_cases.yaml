# Matcher fixtures (PLAN.md §5, Phase 3). Run by app/lib/matcher.test.ts against the local DB.
#
#   in:      what the player typed
#   type:    the question's answer type
#   expect:  the entity the matcher should land on: display name, "Name|ISO2" to disambiguate,
#            or a QID
#   valid:   the question's valid set (defaults to [expect]); lets us test real-but-wrong answers
#   status:  expected status (default: valid when expect is in valid, else real_but_wrong);
#            may be a list of acceptable statuses
#   wrong:   true = a wrong answer; it must NEVER come back "valid" (anti-fishing / snapping)
#   other_type: expected "that's a <type>, not a <type>" hint
#
# Done when (PLAN §8): >= 95% pass, and no `wrong: true` case returns valid.

